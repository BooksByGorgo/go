<script>
    /* Restore the reader's sidebar width before first paint (see
       sidebar-resize.js).  Block comment only: the theme compresses the
       page onto one line, so a // comment would swallow the script. */
    (function () {
        try {
            var w = parseFloat(localStorage.getItem("sidebar-width"));
            if (w > 0) {
                document.documentElement.style.setProperty("--sidebar-width", w + "px");
                document.documentElement.classList.add("sidebar-resized");
            }
        } catch (e) {}
    })();
</script>
<script src="{{ '/assets/js/sidebar-resize.js' | relative_url }}" defer></script>
